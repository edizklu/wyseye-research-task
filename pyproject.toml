[project]
name = "testproje"
version = "0.1.0"
description = "On-Premise LLM Document Analyzer — Extract structured JSON from PDFs using local models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0",
    "ollama>=0.5",
    "pydantic>=2.0",
    "typer>=0.15",
    "reportlab>=4.0",
    "pymupdf>=1.25",
]

[project.scripts]
docanalyze = "docanalyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docanalyzer"]
